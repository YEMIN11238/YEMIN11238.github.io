<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-label="保存固定餐单，检查两家门店，比较保留原样与许可替代的官方报价。样本采集于2026年10月18日。">
  <rect width="1200" height="530" rx="28" fill="#f7f4ec"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
