    <text x="67" y="302" fill="#343b34" font-size="18">汉堡去烤味酱</text>
    <text x="67" y="334" fill="#343b34" font-size="18">中杯无糖可乐 · 去冰</text>
    <rect x="67" y="355" width="294" height="39" rx="10" fill="#edf3ec"/>
