    <text x="67" y="425" fill="#777a72" font-size="14">必须要求不满足，该候选停止</text>
    <path d="M404 319h31m-9-9 10 9-10 9" fill="none" stroke="#a6aaa1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="454" y="190" width="702" height="262" rx="20" fill="#ffffff" stroke="#dedbd2"/>
